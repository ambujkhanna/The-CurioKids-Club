name: Daily Curio Kids Short

on:
  schedule:
    - cron: "40 8 * * *"     # 08:40 UTC = 14:10 IST } scheduled runs use --auto: alternate days, the English video
    - cron: "40 15 * * *"    # 15:40 UTC = 21:10 IST }   posts 17:00-20:00 IST, the Hindi video 09:00-11:00 IST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render + QC only (no upload)"
        type: boolean
        default: false
      episode:
        description: "Force an episode id (e.g. ep003); empty = next in backlog"
        required: false
      publish_now:
        description: "Publish immediately (no schedule)"
        type: boolean
        default: false
      language:
        description: "Language of the video (manual runs): en = English, hi = Hindi voices + English subtitles"
        type: choice
        default: en
        options: [en, hi]
      category:
        description: "Publish the next episode of a CATEGORY instead of the daily Short (leave as none for normal)"
        type: choice
        default: none
        options: [none, comedy, quiz, knowledge, science, abc, counting, rhymes]
      social_only:
        description: "Only post the chosen episode (fill 'episode') to Facebook + Instagram - no YouTube upload"
        type: boolean
        default: false
      refresh_thumbnails:
        description: "Only re-make and upload thumbnails for videos already uploaded (no new video)"
        type: boolean
        default: false
      ig_test:
        description: "Instagram test: posts an 8-s test clip. With an episode id filled in: tests versions of that episode WITHOUT posting"
        type: boolean
        default: false
      social_backfill:
        description: "Post videos already on YouTube to Facebook + Instagram (how many this run; 0 = off)"
        type: choice
        default: "0"
        options: ["0", "1", "2", "3", "4"]
      script:
        description: "Make a video from YOUR script: path of the file, e.g. scripts/bees.txt (format: scripts/README.md)"
        required: false

permissions:
  contents: write

concurrency:
  group: daily-short
  cancel-in-progress: false

jobs:
  render-and-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.11
            3.12
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Chatterbox voices (cached; if this fails the run uses the Kokoro voices)
        id: cbcache
        uses: actions/cache@v4
        with:
          path: |
            ~/cbenv
            ~/.cache/huggingface
          key: chatterbox-v1-${{ runner.os }}

      - name: Install Chatterbox (CPU, first run only)
        continue-on-error: true
        run: |
          if ! ~/cbenv/bin/python -c "import chatterbox" 2>/dev/null; then
            rm -rf ~/cbenv && python3.11 -m venv ~/cbenv
            ~/cbenv/bin/pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
            ~/cbenv/bin/pip install -q chatterbox-tts
          fi
          ~/cbenv/bin/python -c "import chatterbox; print('chatterbox ready')"

      - name: System packages (ffmpeg with libass + rubberband, Inter font, colour emoji)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-inter fonts-noto-color-emoji libegl1 libgl1 libfontconfig1

      - name: Python packages
        run: pip install -r pipeline/requirements.txt

      - name: Cache voice model files
        uses: actions/cache@v4
        with:
          path: |
            kokoro-q8.onnx
            voices.bin
            kokoro-dur.onnx
          key: kokoro-q8-v1

      - name: Prepare voice models
        run: python pipeline/setup_models.py

      - name: Render, QC, upload
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          PUBLISH_WINDOW: ${{ vars.PUBLISH_WINDOW || '17:00-20:00' }}
          PUBLISH_WINDOW_HI: ${{ vars.PUBLISH_WINDOW_HI || '09:00-11:00' }}
          TTS_ENGINE: ${{ vars.TTS_ENGINE || 'chatterbox' }}
          CB_PYTHON: /home/runner/cbenv/bin/python
          CB_TURBO_LAUGHS: ${{ vars.CB_TURBO_LAUGHS || '1' }}
          MADE_FOR_KIDS: ${{ vars.MADE_FOR_KIDS || 'false' }}
          YT_PLAYLIST: ${{ vars.YT_PLAYLIST }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.episode }}" ]; then ARGS="$ARGS --episode ${{ inputs.episode }}"; fi
          if [ "${{ inputs.publish_now }}" = "true" ]; then ARGS="$ARGS --now"; fi
          if [ "${{ inputs.refresh_thumbnails }}" = "true" ]; then ARGS="$ARGS --refresh-thumbnails"; fi
          if [ "${{ inputs.social_only }}" = "true" ]; then ARGS="$ARGS --social-only"; fi
          if [ -n "${{ inputs.category }}" ] && [ "${{ inputs.category }}" != "none" ]; then ARGS="$ARGS --category ${{ inputs.category }}"; fi
          if [ "${{ inputs.ig_test }}" = "true" ]; then ARGS="$ARGS --ig-test"; fi
          if [ -n "${{ inputs.script }}" ]; then ARGS="$ARGS --script ${{ inputs.script }}"; fi
          if [ -n "${{ inputs.social_backfill }}" ] && [ "${{ inputs.social_backfill }}" != "0" ]; then ARGS="$ARGS --social-backfill ${{ inputs.social_backfill }}"; fi
          if [ "${{ github.event_name }}" = "schedule" ]; then ARGS="--auto"; fi
          if [ "${{ inputs.language }}" = "hi" ]; then ARGS="$ARGS --lang hi"; fi
          python pipeline/daily.py $ARGS

      - name: Keep the video as a downloadable artifact (14 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curio-kids-short-${{ github.run_number }}
          path: |
            out/*.mp4
            out/*_thumbnail.jpg
            out/*.jpg
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit run state
        if: always()
        run: |
          python pipeline/save_state.py "Daily run: update episode state"
