name: Daily Curio Kids Short

on:
  schedule:
    - cron: "40 8 * * *"     # 08:40 UTC = 14:10 IST } scheduled runs use --auto: alternate days, the English video
    - cron: "40 15 * * *"    # 15:40 UTC = 21:10 IST }   posts 17:00-20:00 IST, the Hindi video 09:00-11:00 IST
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        default: "Next video (scheduled)"
        options:
          - "Next video (scheduled)"
          - "Next video, publish now"
          - "Dry run (render only, nothing uploaded)"
          - "Refresh thumbnails"
          - "Post 1 old video to Facebook + Instagram"
          - "Post 3 old videos to Facebook + Instagram"
      post_to:
        description: "Where to post"
        type: choice
        default: "YouTube + Facebook + Instagram"
        options:
          - "YouTube + Facebook + Instagram"
          - "YouTube only"
          - "Facebook + Instagram only"
          - "YouTube + Facebook"
          - "YouTube + Instagram"
          - "Facebook only"
          - "Instagram only"
      episode:
        description: "Episode id, e.g. ep014 or s-ollama (empty = next in line; with Refresh thumbnails = only that video)"
        required: false
      script:
        description: "Make a video from YOUR script: a file path (scripts/bees.txt) OR paste the whole script (format: scripts/README.md)"
        required: false
      language:
        description: "Language (manual runs): en = English, hi = Hindi voices + English subtitles"
        type: choice
        default: "en"
        options:
          - "en"
          - "hi"
      category:
        description: "Category instead of the daily Short (none = normal)"
        type: choice
        default: "none"
        options:
          - "none"
          - "comedy"
          - "quiz"
          - "knowledge"
          - "science"
          - "abc"
          - "counting"
          - "rhymes"
          - "varnamala"

permissions:
  contents: write

concurrency:
  group: daily-short
  cancel-in-progress: false

jobs:
  render-and-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.11
            3.12
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Chatterbox voices (cached; if this fails the run uses the Kokoro voices)
        id: cbcache
        uses: actions/cache@v4
        with:
          path: |
            ~/cbenv
            ~/.cache/huggingface
          key: chatterbox-v1-${{ runner.os }}

      - name: Install Chatterbox (CPU, first run only)
        if: ${{ inputs.action != 'Refresh thumbnails' }}
        timeout-minutes: 25
        continue-on-error: true
        run: |
          if ! ~/cbenv/bin/python -c "import chatterbox" 2>/dev/null; then
            rm -rf ~/cbenv && python3.11 -m venv ~/cbenv
            ~/cbenv/bin/pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
            ~/cbenv/bin/pip install -q chatterbox-tts
          fi
          ~/cbenv/bin/python -c "import chatterbox; print('chatterbox ready')"

      - name: System packages (ffmpeg with libass + rubberband, Inter font, colour emoji)
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -q
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -q ffmpeg fonts-inter fonts-noto-color-emoji libegl1 libgl1 libfontconfig1

      - name: Python packages
        run: pip install -r pipeline/requirements.txt

      - name: Cache voice model files
        uses: actions/cache@v4
        with:
          path: |
            kokoro-q8.onnx
            voices.bin
            kokoro-dur.onnx
          key: kokoro-q8-v1

      - name: Prepare voice models
        run: python pipeline/setup_models.py

      - name: Render, QC, upload
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          PUBLISH_WINDOW: ${{ vars.PUBLISH_WINDOW || '17:00-20:00' }}
          PUBLISH_WINDOW_HI: ${{ vars.PUBLISH_WINDOW_HI || '09:00-11:00' }}
          TTS_ENGINE: ${{ vars.TTS_ENGINE || 'chatterbox' }}
          CB_PYTHON: /home/runner/cbenv/bin/python
          CB_TURBO_LAUGHS: ${{ vars.CB_TURBO_LAUGHS || '1' }}
          PYTHONUNBUFFERED: "1"
          ACTION: ${{ inputs.action }}
          POST_TO: ${{ inputs.post_to }}
          EPISODE_IN: ${{ inputs.episode }}
          LANG_IN: ${{ inputs.language }}
          CATEGORY_IN: ${{ inputs.category }}
          KEEP_THUMBS: ${{ vars.KEEP_THUMBS || '2' }}
          YT_TIMEOUT: ${{ vars.YT_TIMEOUT || '300' }}
          INTRO: ${{ vars.INTRO || 'on' }}
          OUTRO: ${{ vars.OUTRO || 'on' }}
          SCRIPT_IN: ${{ inputs.script }}
          HI_TTS_ENGINE: ${{ vars.HI_TTS_ENGINE || 'kokoro' }}
          HI_VOICE_CLIP: ${{ vars.HI_VOICE_CLIP || 'english' }}
          CB_CFG_HI: ${{ vars.CB_CFG_HI || '' }}
          MADE_FOR_KIDS: ${{ vars.MADE_FOR_KIDS || 'false' }}
          YT_PLAYLIST: ${{ vars.YT_PLAYLIST }}
        run: |
          ARGS=""
          case "$ACTION" in
            *"publish now"*) ARGS="--now" ;;
            "Dry run"*) ARGS="--dry-run" ;;
            "Refresh thumbnails") ARGS="--refresh-thumbnails" ;;
            "Post 1 old"*) ARGS="--social-backfill 1" ;;
            "Post 3 old"*) ARGS="--social-backfill 3" ;;
          esac
          if [ -n "$EPISODE_IN" ]; then
            if ! printf "%s" "$EPISODE_IN" | grep -Eq "^[A-Za-z0-9_-]+$"; then echo "episode must be an id like ep014"; exit 1; fi
            ARGS="$ARGS --episode $EPISODE_IN"
          fi
          case "$POST_TO" in ""|*YouTube*) ;; *) ARGS="$ARGS --social-only" ;; esac  # no YouTube: post to the chosen social platforms only
          if [ -n "$CATEGORY_IN" ] && [ "$CATEGORY_IN" != "none" ]; then ARGS="$ARGS --category $CATEGORY_IN"; fi
          if [ "${{ github.event_name }}" = "schedule" ]; then ARGS="--auto"; fi
          if [ "$LANG_IN" = "hi" ]; then ARGS="$ARGS --lang hi"; fi
          python pipeline/daily.py $ARGS

      - name: Keep the video as a downloadable artifact (14 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curio-kids-short-${{ github.run_number }}
          path: |
            out/*.mp4
            out/*_thumbnail.jpg
            out/*.jpg
            out/*.txt
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit run state
        if: always()
        run: |
          python pipeline/save_state.py "Daily run: update episode state"
