name: Daily Curio Kids Short

on:
  schedule:
    - cron: "40 8 * * *"     # 08:40 UTC = 14:10 IST; upload is scheduled inside the 16:00-19:00 IST window
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render + QC only (no upload)"
        type: boolean
        default: false
      episode:
        description: "Force an episode id (e.g. ep003); empty = next in backlog"
        required: false
      publish_now:
        description: "Publish immediately (no schedule)"
        type: boolean
        default: false
      category:
        description: "Publish the next episode of a CATEGORY instead of the daily Short (leave as none for normal)"
        type: choice
        default: none
        options: [none, comedy, quiz, knowledge, science, abc, counting, rhymes]
      social_only:
        description: "Only post the chosen episode (fill 'episode') to Facebook + Instagram - no YouTube upload"
        type: boolean
        default: false
      refresh_thumbnails:
        description: "Only re-make and upload thumbnails for videos already uploaded (no new video)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-short
  cancel-in-progress: false

jobs:
  render-and-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: System packages (ffmpeg with libass + rubberband, Inter font, colour emoji)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-inter fonts-noto-color-emoji libegl1 libgl1 libfontconfig1

      - name: Python packages
        run: pip install -r pipeline/requirements.txt

      - name: Cache voice model files
        uses: actions/cache@v4
        with:
          path: |
            kokoro-q8.onnx
            voices.bin
            kokoro-dur.onnx
          key: kokoro-q8-v1

      - name: Prepare voice models
        run: python pipeline/setup_models.py

      - name: Render, QC, upload
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          PUBLISH_WINDOW: ${{ vars.PUBLISH_WINDOW || '16:00-19:00' }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.episode }}" ]; then ARGS="$ARGS --episode ${{ inputs.episode }}"; fi
          if [ "${{ inputs.publish_now }}" = "true" ]; then ARGS="$ARGS --now"; fi
          if [ "${{ inputs.refresh_thumbnails }}" = "true" ]; then ARGS="$ARGS --refresh-thumbnails"; fi
          if [ "${{ inputs.social_only }}" = "true" ]; then ARGS="$ARGS --social-only"; fi
          if [ -n "${{ inputs.category }}" ] && [ "${{ inputs.category }}" != "none" ]; then ARGS="$ARGS --category ${{ inputs.category }}"; fi
          python pipeline/daily.py $ARGS

      - name: Keep the video as a downloadable artifact (14 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curio-kids-short-${{ github.run_number }}
          path: |
            out/*.mp4
            out/*_thumbnail.jpg
            out/*.jpg
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit run state
        if: always()
        run: |
          git config user.name "curio-kids-bot"
          git config user.email "actions@users.noreply.github.com"
          git add episodes/state.json library 2>/dev/null || git add episodes/state.json || true
          git diff --cached --quiet || (git commit -m "Daily run: update episode state" && git push)
