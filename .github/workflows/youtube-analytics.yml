name: YouTube Analytics — collect report

on:
  push:
    branches:
      - main
      - feat/youtube-growth-engine
      - feat/shared-growth-audit-2026-11
    paths:
      - "pipeline/analytics.py"
      - "pipeline/reach_reporting.py"
      - "pipeline/growth.py"
      - "pipeline/playlist_plan.py"
      - "pipeline/analytics-requirements.txt"
      - "tests/**"
      - "episodes/state.json"
      - "long/state.json"
      - "custom/state.json"
      - "library/**/state.json"
      - ".github/workflows/youtube-analytics.yml"
  schedule:
    - cron: "0 12 * * *" # 17:30 IST; default report ends three days ago
  workflow_dispatch:
    inputs:
      start_date:
        description: "Optional start date (YYYY-MM-DD)"
        required: false
        type: string
      end_date:
        description: "Optional end date (YYYY-MM-DD)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: youtube-analytics
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Restore recent analytics database (best effort)
        uses: actions/cache@v4
        with:
          path: out/analytics/analytics.sqlite3
          key: youtube-analytics-${{ github.run_id }}
          restore-keys: |
            youtube-analytics-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/analytics-requirements.txt

      - name: Install Python dependencies
        run: pip install -r pipeline/analytics-requirements.txt

      - name: Run analytics unit tests
        run: |
          PYTHONPATH=pipeline python -m unittest discover -s tests -v

      - name: Collect read-only analytics
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_ANALYTICS_REFRESH_TOKEN: ${{ secrets.YT_ANALYTICS_REFRESH_TOKEN }}
          ANALYTICS_CHANNEL_KEY: curiokids-club
          ANALYTICS_OUTPUT_DIR: out/analytics
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: |
          if [ -z "$YT_ANALYTICS_REFRESH_TOKEN" ]; then
            echo "::notice::Set YT_ANALYTICS_REFRESH_TOKEN to enable analytics collection."
            exit 0
          fi
          ARGS=""
          if [ -n "$START_DATE" ]; then ARGS="$ARGS --start-date $START_DATE"; fi
          if [ -n "$END_DATE" ]; then ARGS="$ARGS --end-date $END_DATE"; fi
          python pipeline/analytics.py $ARGS

      - name: Build channel-specific growth brief
        if: success() && hashFiles('out/analytics/*.csv') != ''
        run: |
          CSV="$(ls -t out/analytics/*.csv | head -n 1)"
          python pipeline/growth.py --csv "$CSV" --channel-key curiokids-club --period "${{ inputs.start_date || 'default 28-day window' }} to ${{ inputs.end_date || 'latest complete day' }}" --output-dir out/analytics

      - name: Collect read-only thumbnail reach report (Reporting API)
        if: success()
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_ANALYTICS_REFRESH_TOKEN: ${{ secrets.YT_ANALYTICS_REFRESH_TOKEN }}
        run: python pipeline/reach_reporting.py --ensure-job --output-dir out/analytics

      - name: Enrich growth brief with topic performance and thumbnail reach
        if: success() && hashFiles('out/analytics/*.csv') != ''
        run: |
          CSV="$(find out/analytics -maxdepth 1 -type f -name '*_*.csv' ! -name 'reach*' | head -n 1)"
          if [ -n "$CSV" ]; then
            python pipeline/growth.py --csv "$CSV" --channel-key curiokids-club --reach-csv out/analytics/reach_by_video.csv --output-dir out/analytics
          fi

      - name: Build review-only topic and language playlist plan
        if: success()
        run: python pipeline/playlist_plan.py --output-dir out/analytics

      - name: Save analytics database cache
        if: always() && hashFiles('out/analytics/analytics.sqlite3') != ''
        uses: actions/cache/save@v4
        with:
          path: out/analytics/analytics.sqlite3
          key: youtube-analytics-${{ github.run_id }}

      - name: Upload analytics report and database
        if: always() && hashFiles('out/analytics/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: youtube-analytics-${{ github.run_number }}
          path: out/analytics/*
          retention-days: 90
          if-no-files-found: ignore
