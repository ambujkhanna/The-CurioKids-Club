name: Language badge checks
on:
  push:
    branches: [feature/language-title-badges-v2]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install skia-python
      - run: python -m unittest discover -s pipeline/tests -p "test_language_badges.py" -v
      - run: python -m py_compile pipeline/language_badges.py pipeline/thumbnail.py pipeline/thumb_punch.py pipeline/daily.py
