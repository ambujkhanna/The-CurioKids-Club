name: Visual Engine Branch Dry Run

on:
  push:
    branches:
      - feature/modern-visual-engine
    paths:
      - "pipeline/**"
      - "assets/**"
      - ".github/workflows/visual-engine-dry-run.yml"
      - "episodes/ep070-seed-grows-into-tree/**"

permissions:
  contents: read

concurrency:
  group: visual-engine-dry-run
  cancel-in-progress: false

jobs:
  render-review-video:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      # Cache downloaded .deb archives across fresh hosted runners.
      - name: Cache apt package archives
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives/*.deb
          key: ubuntu-24.04-apt-rendering-v1

      - name: Install system rendering dependencies
        run: |
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/keep-cache
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-inter fonts-noto-color-emoji libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libgbm1 libfontconfig1 blender libx11-6 libxext6 libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6

      - name: Install Python dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Render episode-specific 3D story assets
        run: |
          mkdir -p out/blender/story
          export LIBGL_ALWAYS_SOFTWARE=1
          export EGL_PLATFORM=surfaceless
          blender --background --threads 2 --python pipeline/blender/create_story_assets.py -- --output-dir out/blender/story --resolution 1080

      # Cache the large Kokoro weights; setup_models.py rebuilds on a cache miss.
      - name: Cache Kokoro voice models
        uses: actions/cache@v4
        with:
          path: |
            kokoro-q8.onnx
            voices.bin
            kokoro-dur.onnx
          key: kokoro-models-v1-${{ hashFiles('pipeline/setup_models.py') }}

      - name: Prepare voice models
        run: python pipeline/setup_models.py

      - name: Validate asset manifest
        run: python pipeline/asset_manager.py

      - name: Run visual engine unit tests
        run: |
          python -m unittest pipeline.tests.test_asset_manager pipeline.tests.test_visual_layers -v

      - name: Render and QC pilot episode (no publishing)
        env:
          ACTION: "Dry run (render only, nothing uploaded)"
          TTS_ENGINE: kokoro
          CURIO_VISUAL_STYLE: garden
          WORKERS: "2"
          PYTHONUNBUFFERED: "1"
        run: python pipeline/daily.py --dry-run --episode ep070

      - name: Upload review video and thumbnails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curiokids-modern-visual-engine-review
          path: |
            out/*.mp4
            out/*.jpg
            out/*.txt
            pipeline/build/shots.json
          retention-days: 14
          if-no-files-found: warn
