name: Weekly topic radar

# Roadmap R2 + R3 (2026-11-22): what people search for + what viewers ask for in comments.
# Opens a GitHub issue "Topic radar YYYY-WNN" with tick boxes. Read-only towards YouTube. Repo variable RADAR=off stops it.
# + Google Trends and YouTube trending (owner, 2026-11-22): in the weekly report, and a DAILY quick check that opens a
#   "Trend alert" issue only when a new trending subject fits the channel (RADAR_TRENDS=off stops the daily check).
on:
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC (08:47 IST): the full weekly report
    - cron: "47 1 * * *"   # every day 01:47 UTC (07:17 IST): quick trend check (issue only if something new fits)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: topic-radar
  cancel-in-progress: true

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -q google-api-python-client google-auth
      - name: Topic radar
        env:
          RADAR: ${{ vars.RADAR || 'on' }}
          RADAR_TRENDS: ${{ vars.RADAR_TRENDS || 'on' }}
          RADAR_GEOS: ${{ vars.RADAR_GEOS || 'IN,US,MX' }}
          CRON: ${{ github.event.schedule }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_ANALYTICS_REFRESH_TOKEN: ${{ secrets.YT_ANALYTICS_REFRESH_TOKEN }}
          YT_ANALYTICS_CLIENT_ID: ${{ secrets.YT_ANALYTICS_CLIENT_ID }}
          YT_ANALYTICS_CLIENT_SECRET: ${{ secrets.YT_ANALYTICS_CLIENT_SECRET }}
        run: |
          if [ "$CRON" = "47 1 * * *" ]; then python pipeline/radar.py --trends-only; else python pipeline/radar.py; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: topic-radar
          path: radar/latest.md
          if-no-files-found: ignore
