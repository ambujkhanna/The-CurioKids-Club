name: Voice Lab (Chatterbox voice samples)

on:
  workflow_dispatch: {}

jobs:
  chatterbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Install Chatterbox (CPU)
        run: |
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install chatterbox-tts
      - name: Make samples
        run: python voicelab/voice_lab.py chatterbox
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-lab-chatterbox
          path: voicelab/out/
          retention-days: 14

