name: Growth engine tests

on:
  pull_request:
    paths:
      - "pipeline/growth.py"
      - "tests/**"
      - ".github/workflows/growth-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run analytics and growth unit tests
        run: PYTHONPATH=pipeline python -m unittest discover -s tests -v
