name: Blender 3D Proof of Capability

on:
  push:
    branches:
      - feature/modern-visual-engine
    paths:
      - "pipeline/blender/**"
      - ".github/workflows/blender-3d-proof.yml"
      - "progress.md"
      - "plan.md"

permissions:
  contents: read

concurrency:
  group: blender-3d-proof
  cancel-in-progress: false

jobs:
  render-3d-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q blender libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libgbm1 libx11-6 libxext6 libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6

      - name: Generate real 3D seed-growth scene
        run: |
          mkdir -p out/blender
          export LIBGL_ALWAYS_SOFTWARE=1
          export EGL_PLATFORM=surfaceless
          blender --background --threads 2 --python pipeline/blender/create_seed_scene.py -- --output-dir out/blender --resolution 1080

      - name: Verify rendered outputs
        run: |
          test -s out/blender/seed_germination_3d.png
          test -s out/blender/seed_germination_3d.blend
          file out/blender/seed_germination_3d.png
          python - <<'PY'
          # Validate PNG IHDR using Python's standard library; do not add Pillow
          # just for this lightweight CI check.
          import struct
          from pathlib import Path
          path = Path("out/blender/seed_germination_3d.png")
          with path.open("rb") as stream:
              header = stream.read(29)
          assert header[:8] == b"\x89PNG\r\n\x1a\n", "Invalid PNG signature"
          length, chunk_type = struct.unpack(">I4s", header[8:16])
          assert length == 13 and chunk_type == b"IHDR", "Missing PNG IHDR"
          width, height, bit_depth, color_type, compression, filtering, interlace = struct.unpack(">IIBBBBB", header[16:29])
          assert (width, height) == (1080, 1920), (width, height)
          assert bit_depth == 8, bit_depth
          assert color_type == 6, f"Expected RGBA PNG (color type 6), got {color_type}"
          assert path.stat().st_size > 100_000, f"Unexpectedly small render: {path.stat().st_size} bytes"
          print(f"3D render verified: {width}x{height}, 8-bit RGBA, {path.stat().st_size} bytes")
          PY

      - name: Upload Blender source and render
        uses: actions/upload-artifact@v4
        with:
          name: curiokids-blender-3d-proof
          path: |
            out/blender/seed_germination_3d.png
            out/blender/seed_germination_3d.blend
          retention-days: 14
